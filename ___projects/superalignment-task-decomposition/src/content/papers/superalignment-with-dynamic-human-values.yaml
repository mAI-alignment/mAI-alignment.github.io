title: Superalignment with Dynamic Human Values
authors:
  - Florian Mai
  - David Kaczér
  - Nicholas Kluge Corrêa
  - Lucie Flek
venue: ICLR 2025 Workshop on Bidirectional Human-AI Alignment (BiAlign)
date: 2025-03-17
url: https://arxiv.org/abs/2503.13621
links:
  - label: PDF
    href: https://arxiv.org/pdf/2503.13621
  - label: Workshop
    href: https://iclr.cc/virtual/2025/workshop/23986
abstract: >-
  Two core challenges of alignment are 1) scalable oversight and 2) accounting for the dynamic nature of
  human values. While solutions like recursive reward modeling address 1), they do not simultaneously
  account for 2). We sketch a roadmap for a novel algorithmic framework that trains a superhuman reasoning
  model to decompose complex tasks into subtasks that are still amenable to human-level guidance. Our
  approach relies on what we call the part-to-complete generalization hypothesis, which states that the
  alignment of subtask solutions generalizes to the alignment of complete solutions. We advocate for the
  need to measure this generalization and propose ways to improve it in the future.
